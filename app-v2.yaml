# ─────────────────────────────────────────────────────────────
# Q2: Version v2 — deploy then split traffic 80/20
# Deploy: gcloud app deploy app-v2.yaml --version=v2 --no-promote
# Split:  gcloud app services set-traffic default \
#           --splits v1=0.8,v2=0.2 --split-by=random
# ─────────────────────────────────────────────────────────────
runtime: nodejs20
env: standard

service: default

manual_scaling:
  instances: 2

env_variables:
  NODE_ENV: "production"
  APP_VERSION: "v2"
  APP_COLOR: "#ec4899"
