# ─────────────────────────────────────────────────────────────
# Q1: App Engine FLEXIBLE — custom Docker image
# Uses the Dockerfile in this directory
# ─────────────────────────────────────────────────────────────
runtime: custom          # tells GAE Flex to use our Dockerfile
env: flex

service: default

resources:
  cpu: 1
  memory_gb: 0.5
  disk_size_gb: 10

automatic_scaling:
  min_num_instances: 1
  max_num_instances: 3
  cool_down_period_sec: 120
  cpu_utilization:
    target_utilization: 0.65

env_variables:
  NODE_ENV: "production"
  APP_VERSION: "v1"
  APP_COLOR: "#6366f1"
